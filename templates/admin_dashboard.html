<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛠️ لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--primary:#10b981;--secondary:#3b82f6;--warn:#fbbf24;--danger:#ef4444;--text:#f8fafc;--muted:#94a3b8;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:16px;}
.container{max-width:900px;margin:0 auto;}
header{text-align:center;padding:24px;background:var(--card);border-radius:20px;margin-bottom:20px;}
h1{margin:0 0 8px;font-size:1.8rem;color:var(--primary);}
header p{color:var(--muted);font-size:0.95rem;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.card{background:var(--card);padding:24px;border-radius:20px;text-decoration:none;color:var(--text);text-align:center;transition:transform .15s,box-shadow .15s;border:2px solid transparent;}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.4);border-color:var(--primary);}
.card:active{transform:translateY(-2px);}
.card .icon{font-size:3rem;margin-bottom:12px;}
.card .title{font-size:1.15rem;font-weight:900;margin-bottom:8px;color:var(--primary);}
.card .desc{font-size:0.85rem;color:var(--muted);}
.card.danger{border-color:var(--danger);}
.card.danger .title{color:var(--danger);}
.footer{margin-top:24px;text-align:center;}
.footer a{color:var(--muted);text-decoration:none;padding:12px 24px;background:var(--card);border-radius:999px;display:inline-block;font-weight:700;}
.footer a:hover{color:var(--text);}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🛠️ لوحة الإدارة</h1>
    <p>إدارة لعبة game1</p>
  </header>

  <div class="cards">
    <a href="/admin/images" class="card">
      <div class="icon">🖼️</div>
      <div class="title">جلب الصور</div>
      <div class="desc">جلب صور الحيوانات من الإنترنت</div>
    </a>

    <a href="/admin/stats" class="card">
      <div class="icon">📊</div>
      <div class="title">إحصائيات التقدم</div>
      <div class="desc">النجوم والإنجازات</div>
    </a>

    <a href="/recordings" class="card">
      <div class="icon">🎤</div>
      <div class="title">تسجيل الأصوات</div>
      <div class="desc">سجّل صوتك لكل سؤال</div>
    </a>

    <a href="/admin/report" class="card">
      <div class="icon">📈</div>
      <div class="title">تقرير مفصل</div>
      <div class="desc">تقدم الطفلة بالتفصيل</div>
    </a>

    <a href="/" class="card">
      <div class="icon">🎮</div>
      <div class="title">العب اللعبة</div>
      <div class="desc">افتح اللعبة للطفلة</div>
    </a>
  </div>

  <div class="footer">
    <a href="/">← العودة للعبة</a>
  </div>
</div>
</body>
</html>
